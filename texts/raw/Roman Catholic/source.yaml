# Source catalogue for the Roman Catholic corpus.
# Two targets: the public Vatican encyclicals (committed, open) and the NABRE
# Bible (restricted — a copyrighted translation held back; payload is git-ignored
# and local-only). Converters: encyclicals, nabre.
#
# The encyclicals target's work/version here are nominal: the encyclicals
# converter emits one document per file with the work set to the encyclical's
# title and the version to its Vatican edition.
notes: >-
  Encyclicals: Vatican-published English texts. NABRE: restricted, excluded by
  default (opt in with --include-restricted, requires the local payload).
targets:
  - payload: encyclicals/en/*.json
    converter: encyclicals
    work: Papal Encyclicals
    version: Vatican English
    language: en
    document_type: encyclical
    tradition: [Roman Catholic]
    license: open
    license_detail: Vatican-published English texts (vatican.va)
  - payload: nabre.json
    converter: nabre
    work: The Bible
    version: NABRE
    language: en
    document_type: scripture
    tradition: [Roman Catholic]
    license: restricted
    license_detail: >-
      New American Bible Revised Edition — (c) Confraternity of Christian
      Doctrine / USCCB; payload held back from this public repo
