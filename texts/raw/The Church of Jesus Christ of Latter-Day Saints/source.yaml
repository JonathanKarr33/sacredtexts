# Source catalogue for the Latter-Day Saints corpus.
# Three distinctively-LDS works in the nested shape
# {book: {heading, chapter: {verse: text}}}. Converter: lds_nested (Phase 2).
#
# The LDS 2013 edition of the KJV (Old/New Testament) is intentionally NOT a target:
# its text is the Protestant KJV, so keeping it would ask the same questions twice
# (issue #27, Q3). The committable LDS texts are the three below, all composed in
# English.
# The two KJV payloads (old-testament-/new-testament-reference-KJV-ben-crowder.json)
# remain on disk but are deliberately uncatalogued — the Protestant KJV target covers
# the same text.
provenance:
  retrieved_from: Ben Crowder LDS scripture reference compilations (2013 edition)
  fetch_method: working-group Box drop ("Phase I / raw JSON")
  fetch_date: "2026-10-10"
notes: >-
  Reference compilations by Ben Crowder of the LDS 2013 edition scriptures.
targets:
  - payload: book-of-mormon-reference-2013-edition-ben-crowder.json
    converter: lds_nested
    work: Book of Mormon
    version: 2013 edition
    language: en
    document_type: scripture
    tradition: [The Church of Jesus Christ of Latter-Day Saints]
    license: open
    license_detail: LDS 2013 edition; reference compilation by Ben Crowder
    requested_as: ["the Book of Mormon"]
    canonical_language: en
  - payload: doctrine-and-covenants-reference-2013-edition-ben-crowder.json
    converter: lds_nested
    work: Doctrine and Covenants
    version: 2013 edition
    language: en
    document_type: scripture
    tradition: [The Church of Jesus Christ of Latter-Day Saints]
    license: open
    license_detail: LDS 2013 edition; reference compilation by Ben Crowder
    requested_as: ["the Doctrine and Covenants", "the D&C"]
    canonical_language: en
  - payload: pearl-of-great-price-reference-2013-edition-ben-crowder.json
    converter: lds_nested
    work: Pearl of Great Price
    version: 2013 edition
    language: en
    document_type: scripture
    tradition: [The Church of Jesus Christ of Latter-Day Saints]
    license: open
    license_detail: LDS 2013 edition; reference compilation by Ben Crowder
    requested_as: ["the Pearl of Great Price"]
    canonical_language: en
