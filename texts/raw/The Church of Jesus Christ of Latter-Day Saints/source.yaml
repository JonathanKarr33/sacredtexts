# Source catalogue for the Latter-Day Saints corpus.
# Five works in the nested shape {book: {heading, chapter: {verse: text}}}.
# Converter: lds_nested (Phase 2).
#
# The two KJV-based works (Old/New Testament) are the LDS 2013 EDITION of the KJV,
# a distinct edition from the Protestant KJV (editorial/orthographic differences),
# so they carry the version label "KJV (LDS 2013 edition)" — not the same version
# as Protestant Christian's "KJV". OT and NT share (work, version, language) and
# merge into one document downstream.
provenance:
  retrieved_from: Ben Crowder LDS scripture reference compilations (2013 edition)
  fetch_method: downloaded JSON
  fetch_date: unknown
notes: >-
  Reference compilations by Ben Crowder of the LDS 2013 edition scriptures.
targets:
  - payload: book-of-mormon-reference-2013-edition-ben-crowder.json
    converter: lds_nested
    work: Book of Mormon
    version: 2013 edition
    language: en
    document_type: scripture
    tradition: [The Church of Jesus Christ of Latter-Day Saints]
    license: open
    license_detail: LDS 2013 edition; reference compilation by Ben Crowder
  - payload: doctrine-and-covenants-reference-2013-edition-ben-crowder.json
    converter: lds_nested
    work: Doctrine and Covenants
    version: 2013 edition
    language: en
    document_type: scripture
    tradition: [The Church of Jesus Christ of Latter-Day Saints]
    license: open
    license_detail: LDS 2013 edition; reference compilation by Ben Crowder
  - payload: pearl-of-great-price-reference-2013-edition-ben-crowder.json
    converter: lds_nested
    work: Pearl of Great Price
    version: 2013 edition
    language: en
    document_type: scripture
    tradition: [The Church of Jesus Christ of Latter-Day Saints]
    license: open
    license_detail: LDS 2013 edition; reference compilation by Ben Crowder
  - payload: old-testament-reference-KJV-ben-crowder.json
    converter: lds_nested
    work: The Bible
    version: KJV (LDS 2013 edition)
    language: en
    document_type: scripture
    tradition: [The Church of Jesus Christ of Latter-Day Saints]
    license: public-domain
    license_detail: KJV Old Testament as published in the LDS 2013 edition; reference compilation by Ben Crowder
  - payload: new-testament-reference-KJV-ben-crowder.json
    converter: lds_nested
    work: The Bible
    version: KJV (LDS 2013 edition)
    language: en
    document_type: scripture
    tradition: [The Church of Jesus Christ of Latter-Day Saints]
    license: public-domain
    license_detail: KJV New Testament as published in the LDS 2013 edition; reference compilation by Ben Crowder
