# Source catalogue for the Greek Orthodox corpus.
# RESTRICTED and held back: the payload (TLG corpus extracts; Rahlfs Septuagint /
# Nestle-Aland Greek New Testament editions) is a licensed/copyrighted corpus and
# is NOT committed to this public repo. This source.yaml IS committed so the
# catalogue, licensing, and provenance stay complete and auditable; the payload
# glob resolves to nothing until a user supplies it locally.
provenance:
  retrieved_from: Thesaurus Linguae Graecae (TLG); Rahlfs Septuagint / Nestle-Aland editions
  fetch_method: licensed corpus extract, held back; obtain from working-group Box ("Phase I / raw JSON")
  fetch_date: unknown
notes: >-
  Payload absent from the public repo. Converter and metadata are recorded for
  provenance; the target is excluded from convert/generate by default.
targets:
  - payload: "*.json"
    converter: tlg
    work: Septuagint & Greek New Testament
    version: TLG
    language: grc
    document_type: scripture
    tradition: [Greek Orthodox]
    license: restricted
    license_detail: >-
      TLG corpus extracts (licensed); Rahlfs Septuagint / Nestle-Aland editions
      copyrighted; payload held back from this public repo
